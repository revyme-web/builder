<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <!-- Same square icon set as the landing app (white mark on dark rounded
       square) so every Revyme surface shows one favicon. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Private app shell (the editor) — keep every route out of search. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>Revyme</title>
  <style>
    #root { height: 100vh; }
    .selected-node-highlight { background: rgba(99, 102, 241, 0.12) !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
